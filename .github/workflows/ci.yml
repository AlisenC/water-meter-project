name: CI

on:
  pull_request:
  push:
    branches: [master]
    # A push that ONLY touches this file is the update-image-tags job's own
    # bump commit landing on master. Without this, that push re-triggers the
    # whole workflow, which rebuilds/re-pushes images under a new commit sha
    # (even though the underlying code didn't change) and update-image-tags
    # bumps the tag again -- an infinite loop of tag-bump PRs, each auto-
    # merging into the next. A push that changes this file *and* something
    # else still runs normally.
    paths-ignore:
      - apps/water-meter/release.yaml
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: water_meter_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql+psycopg://test:test@localhost:5432/water_meter_test
      TEST_DATABASE_URL: postgresql+psycopg://test:test@localhost:5432/water_meter_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r backend/requirements-dev.txt
      - run: alembic -c backend/alembic.ini upgrade head
      - run: pytest backend/tests -v

  frontend-checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  backend-image:
    needs: backend-tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/alisenc/water-meter-backend
          tags: |
            type=sha
            type=raw,value=latest
      - uses: docker/build-push-action@v6
        with:
          context: backend
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  frontend-image:
    needs: frontend-checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/alisenc/water-meter-frontend
          tags: |
            type=sha
            type=raw,value=latest
      - uses: docker/build-push-action@v6
        with:
          context: frontend
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  update-image-tags:
    needs: [backend-image, frontend-image]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.ROLLOUT_PAT }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --quiet "ruamel.yaml==0.18.*"
      - name: Bump image tags in apps/water-meter/release.yaml
        id: bump
        run: |
          set -euo pipefail
          TAG="sha-${GITHUB_SHA:0:7}"
          python .github/scripts/bump_image_tags.py apps/water-meter/release.yaml "$TAG"

          if git diff --quiet -- apps/water-meter/release.yaml; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          BRANCH="automation/bump-image-tags-${GITHUB_SHA:0:7}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add apps/water-meter/release.yaml
          git commit -m "chore: bump water-meter image tags to $TAG"
          git push origin "$BRANCH"

          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
      - name: Open and auto-merge PR
        if: steps.bump.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.ROLLOUT_PAT }}
        run: |
          set -euo pipefail
          PR_URL=$(gh pr create \
            --title "chore: bump water-meter image tags to ${{ steps.bump.outputs.tag }}" \
            --body "Automated follow-up to ${{ github.sha }}: points the water-meter HelmRelease at the images CI just published (\`${{ steps.bump.outputs.tag }}\`), so Flux picks up the change." \
            --head "${{ steps.bump.outputs.branch }}" \
            --base master)
          gh pr merge --auto --squash "$PR_URL"
