apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: water-meter
  namespace: water-meter
spec:
  interval: 10m0s
  # Default 5m Helm timeout is too tight on this box: the ollama image pull
  # plus control-plane status updates under memory pressure can both run
  # past it, failing the install before it even reaches the post-install
  # model-pull hook.
  timeout: 20m0s
  chart:
    spec:
      chart: ./charts/water-meter
      sourceRef:
        kind: GitRepository
        name: flux-system
        namespace: flux-system
  values:
    # Frontend traffic is same-origin through nginx's /api/ proxy (see
    # frontend/src/api.js), so this only matters for direct browser calls to
    # the backend. Must be https:// -- Cloudflare terminates TLS at its edge,
    # but the browser's Origin header on requests is still the public
    # https:// URL, so an http:// value here would reproduce the exact CORS
    # bug this migration set out to fix.
    allowedOrigins: "https://water-meter.steamingcloud.com"
    cloudflared:
      # Tunnel created in #43 (`cloudflared tunnel create water-meter`).
      tunnelId: "c41d8657-892d-4e58-95e5-9fe4d4ae76ed"
      hostname: "water-meter.steamingcloud.com"
    image:
      backend:
        tag: sha-5eef396
      frontend:
        tag: sha-5eef396
