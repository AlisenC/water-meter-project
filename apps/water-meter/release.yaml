apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: water-meter
  namespace: water-meter
spec:
  interval: 10m0s
  chart:
    spec:
      chart: ./charts/water-meter
      sourceRef:
        kind: GitRepository
        name: flux-system
        namespace: flux-system
  values:
    # Frontend traffic is same-origin through nginx's /api/ proxy (see
    # frontend/src/api.js), so this doesn't gate the app's own requests today
    # — placeholder until #44 sets up the Cloudflare Tunnel hostname.
    allowedOrigins: "http://localhost:8080"
