apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: backend-data
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "water-meter.labels" . | nindent 4 }}
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: {{ .Values.backend.pvc.storageClassName }}
  resources:
    requests:
      storage: {{ .Values.backend.pvc.size }}
