apiVersion: v1
kind: Service
metadata:
  # Literal "backend" — frontend/nginx.conf's proxy_pass http://backend:8000/
  # depends on this exact name.
  name: backend
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "water-meter.labels" . | nindent 4 }}
spec:
  selector:
    app: backend
  ports:
    - port: 8000
      targetPort: 8000
