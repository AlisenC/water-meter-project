apiVersion: v1
kind: Service
metadata:
  # Literal "frontend" for consistency with the backend Service naming.
  name: frontend
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "water-meter.labels" . | nindent 4 }}
spec:
  selector:
    app: frontend
  ports:
    - port: 80
      targetPort: 80
