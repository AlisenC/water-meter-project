apiVersion: v1
kind: Service
metadata:
  # Literal "ollama" — configmap.yaml's OLLAMA_BASE_URL depends on this exact name.
  name: ollama
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "water-meter.labels" . | nindent 4 }}
spec:
  selector:
    app: ollama
  ports:
    - port: 11434
      targetPort: 11434
