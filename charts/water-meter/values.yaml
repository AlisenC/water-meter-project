# ALLOWED_ORIGINS has no default on purpose — templates/configmap.yaml wraps it in
# Helm's `required` so a missing value fails the release loudly instead of silently
# breaking CORS. Set it via the HelmRelease in apps/water-meter/release.yaml.
allowedOrigins: ""

ollamaModel: llama3.1

image:
  backend:
    repository: ghcr.io/alisenc/water-meter-backend
    tag: latest
    pullPolicy: Always
  frontend:
    repository: ghcr.io/alisenc/water-meter-frontend
    tag: latest
    pullPolicy: Always
  ollama:
    repository: ollama/ollama
    tag: latest
    pullPolicy: IfNotPresent
  cloudflared:
    repository: cloudflare/cloudflared
    # Pinned (unlike the other images) because this is the app's only path to
    # the internet — an unplanned upstream version bump breaking the tunnel
    # would fail silently (no git change, no Flux reconcile to point at).
    tag: "2026.8.3"
    pullPolicy: IfNotPresent

databaseSecretName: database-url

# tunnelId and hostname have no default on purpose, same reasoning as
# allowedOrigins above — set via the HelmRelease in apps/water-meter/release.yaml.
cloudflared:
  tunnelId: ""
  hostname: ""
  credentialsSecretName: cloudflared-credentials
  resources:
    requests:
      memory: 32Mi
    limits:
      memory: 128Mi

backend:
  replicaCount: 1
  pvc:
    size: 2Gi
    storageClassName: local-path

ollama:
  pvc:
    size: 10Gi
    storageClassName: local-path
  resources:
    requests:
      memory: 512Mi
    limits:
      # Caps a runaway/OOM load to killing just this container (visible as a
      # restart) instead of risking the whole node on this 3.8GiB box.
      memory: 2Gi
