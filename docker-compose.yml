services:
  backend:
    build:
      context: ./backend
    ports:
      - "8500:8000"
    volumes:
      - ./data:/app/data
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - DATA_DIR=/app/data
      - OLLAMA_BASE_URL=http://ollama:11434
      - OLLAMA_MODEL=llama3.1
    depends_on:
      - ollama

  ollama:
    image: ollama/ollama:latest
    volumes:
      - ollama_data:/root/.ollama

  # One-shot: pulls the default model into the ollama volume, then exits.
  # Re-running is a no-op once the model is already present.
  ollama-pull:
    image: ollama/ollama:latest
    entrypoint: ["/bin/sh", "-c", "ollama pull llama3.1"]
    environment:
      - OLLAMA_HOST=ollama:11434
    depends_on:
      - ollama

  frontend:
    build:
      context: ./frontend
    ports:
      - "8080:80"
    depends_on:
      - backend

volumes:
  water_meter_data:
  ollama_data:
