services:
  backend:
    build:
      context: ./backend
    ports:
      - "8500:8000"
    volumes:
      - ./data:/app/data
    environment:
      - DATABASE_URL=sqlite:////app/data/water_meter.db
      - DATA_DIR=/app/data

  frontend:
    build:
      context: ./frontend
    ports:
      - "8080:80"
    depends_on:
      - backend

volumes:
  water_meter_data:
