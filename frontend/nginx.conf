server {
    listen 80;
    server_name _;

    # Real bill PDFs can run several MB (embedded logos/graphics across multiple pages) —
    # nginx's 1MB default would otherwise reject the upload before it reaches the backend.
    client_max_body_size 20M;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://backend:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
